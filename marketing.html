<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketing Kit — Arena Coliseu</title>
<link rel="stylesheet" href="styles.css">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
.mk-page{padding:calc(var(--header-h)+20px) 0 0;min-height:100vh;display:flex;flex-direction:column}
.mk-tabs{display:flex;gap:0;padding:0 clamp(20px,4vw,60px);border-bottom:1px solid rgba(255,255,255,.06);position:sticky;top:var(--header-h);z-index:10;background:var(--black)}
.mk-tab{padding:14px 28px;font-family:'Oswald',sans-serif;font-size:15px;font-weight:600;letter-spacing:.15em;color:var(--gray);cursor:pointer;border-bottom:3px solid transparent;transition:all .3s;background:none;text-transform:uppercase}
.mk-tab:hover{color:var(--white)}
.mk-tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.mk-content{display:flex;flex:1;min-height:0}
.mk-grid-wrap{flex:1;padding:24px clamp(16px,3vw,40px);overflow-y:auto;max-height:calc(100vh - var(--header-h) - 55px)}
.mk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:14px}
.mk-grid--banner{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.mk-grid--video{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.mk-thumb{position:relative;border-radius:10px;overflow:hidden;cursor:pointer;border:2px solid transparent;transition:all .3s;background:var(--black-card)}
.mk-thumb:hover{border-color:rgba(212,168,67,.3);transform:translateY(-3px);box-shadow:0 8px 25px rgba(0,0,0,.4)}
.mk-thumb.selected{border-color:var(--gold);box-shadow:0 0 20px rgba(212,168,67,.15)}
.mk-thumb__canvas{width:100%;aspect-ratio:1/1;display:block;background:var(--black-card)}
.mk-thumb__canvas--banner{aspect-ratio:297/420}
.mk-thumb__canvas--video{aspect-ratio:9/16}
.mk-thumb__label{position:absolute;bottom:0;left:0;right:0;padding:10px 12px;background:linear-gradient(to top,rgba(0,0,0,.9) 20%,transparent);font-size:11px;color:var(--white);font-weight:600;letter-spacing:.03em}
.mk-preview{width:440px;min-width:440px;border-left:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;background:var(--black-light);max-height:calc(100vh - var(--header-h) - 55px);overflow-y:auto}
.mk-preview__empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--gray);font-size:13px;text-align:center;padding:40px}
.mk-preview__empty svg{opacity:.2;margin-bottom:12px}
.mk-preview__content{padding:24px}
.mk-preview__title{font-family:'Oswald',sans-serif;font-size:22px;font-weight:600;color:var(--white);letter-spacing:.04em;margin-bottom:6px}
.mk-preview__desc{font-size:13px;color:var(--gray-light);margin-bottom:18px;line-height:1.5}
.mk-preview__render{background:var(--black-card);border-radius:10px;overflow:hidden;margin-bottom:18px;min-height:180px;display:flex;align-items:center;justify-content:center;color:var(--gray);font-size:12px}
.mk-preview__render canvas{width:100%!important;height:auto!important;display:block;border-radius:10px}
.mk-preview__actions{display:flex;gap:10px}
.mk-render{position:fixed;left:-9999px;top:0;z-index:-1}
@media(max-width:1100px){.mk-content{flex-direction:column}.mk-preview{width:100%;min-width:0;max-height:none;border-left:none;border-top:1px solid rgba(255,255,255,.06)}.mk-grid-wrap{max-height:none}}
@media(max-width:600px){.mk-grid{grid-template-columns:repeat(2,1fr);gap:10px}.mk-tab{padding:10px 14px;font-size:12px}}

/* ========== POST BASE ========== */
.p{position:relative;overflow:hidden;font-family:'Outfit',sans-serif}
.p *{box-sizing:border-box}
.p-ig{width:1080px;height:1080px}
.p-bn{width:1190px;height:1684px}
.p-st{width:1080px;height:1920px}

/* Grain */
.p::after{content:'';position:absolute;inset:0;z-index:50;pointer-events:none;opacity:.04;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}

.pz{position:relative;z-index:10}
</style>
</head>
<body>
<header class="header" id="header">
  <a href="index.html"><img src="assets/img/logo.png" alt="Arena Coliseu" class="header__logo"></a>
  <nav class="nav" id="nav">
    <a href="index.html" class="nav__link" onclick="closeNav()">Home</a>
    <a href="marketing.html" class="nav__link active" onclick="closeNav()">Marketing</a>
    <a href="inscricao-time.html" class="nav__cta" onclick="closeNav()">Inscrever Time</a>
  </nav>
  <button class="hamburger" id="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
</header>

<div class="mk-page">
  <div class="mk-tabs">
    <button class="mk-tab active" data-tab="posts">Instagram</button>
    <button class="mk-tab" data-tab="banners">Banners</button>
    <button class="mk-tab" data-tab="videos">Stories</button>
  </div>
  <div class="mk-content">
    <div class="mk-grid-wrap"><div class="mk-grid" id="gridContainer"></div></div>
    <div class="mk-preview" id="previewPanel">
      <div class="mk-preview__empty"><div><svg viewBox="0 0 24 24" style="width:48px;height:48px;fill:var(--gray-dark)"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg><br>Selecione um item para visualizar</div></div>
    </div>
  </div>
</div>

<div class="mk-render" id="renderArea"></div>

<script>
const header=document.getElementById('header');window.addEventListener('scroll',()=>{header.classList.toggle('scrolled',window.scrollY>50)});
const hamburger=document.getElementById('hamburger'),nav=document.getElementById('nav');hamburger.addEventListener('click',()=>{hamburger.classList.toggle('active');nav.classList.toggle('open');document.body.style.overflow=nav.classList.contains('open')?'hidden':'';});function closeNav(){hamburger.classList.remove('active');nav.classList.remove('open');document.body.style.overflow='';}

const L='assets/img/logo.png',CL='assets/img/logo-counter-strike-2.png',VL='assets/img/logo-valorant.png';

/* ===================================================
   UI ENGINE
   =================================================== */
const grid=document.getElementById('gridContainer'),preview=document.getElementById('previewPanel'),render=document.getElementById('renderArea');
let currentTab='posts',selectedId=null;

document.querySelectorAll('.mk-tab').forEach(t=>{t.addEventListener('click',()=>{document.querySelectorAll('.mk-tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');currentTab=t.dataset.tab;selectedId=null;buildGrid();showEmpty()})});

function showEmpty(){preview.innerHTML='<div class="mk-preview__empty"><div><svg viewBox="0 0 24 24" style="width:48px;height:48px;fill:var(--gray-dark)"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg><br>Selecione um item para visualizar</div></div>'}

function buildGrid(){
  const items=posts.filter(p=>p.tab===currentTab);
  const isB=currentTab==='banners',isV=currentTab==='videos';
  grid.className='mk-grid'+(isB?' mk-grid--banner':'')+(isV?' mk-grid--video':'');
  grid.innerHTML=items.map(item=>{
    const ac=isB?'mk-thumb__canvas--banner':isV?'mk-thumb__canvas--video':'';
    return`<div class="mk-thumb${selectedId===item.id?' selected':''}" data-id="${item.id}"><div class="mk-thumb__canvas ${ac}" id="th_${item.id}"></div><div class="mk-thumb__label">${item.title}</div></div>`;
  }).join('');
  items.forEach(genThumb);
  grid.querySelectorAll('.mk-thumb').forEach(el=>{el.addEventListener('click',()=>selectItem(el.dataset.id))});
}

function genThumb(item){
  render.innerHTML=item.html;
  const el=render.firstElementChild;
  html2canvas(el,{useCORS:true,scale:0.2,backgroundColor:null,logging:false}).then(c=>{
    const t=document.getElementById('th_'+item.id);
    if(t){t.innerHTML='';c.style.cssText='width:100%;height:100%;object-fit:cover;display:block';t.appendChild(c)}
    render.innerHTML='';
  }).catch(()=>{render.innerHTML=''});
}

function selectItem(id){
  selectedId=id;
  const item=posts.find(p=>p.id===id);if(!item)return;
  grid.querySelectorAll('.mk-thumb').forEach(t=>t.classList.toggle('selected',t.dataset.id===id));
  preview.innerHTML=`<div class="mk-preview__content"><div class="mk-preview__title">${item.title}</div><div class="mk-preview__desc">${item.desc}</div><div class="mk-preview__render" id="pvRender"><span style="padding:40px">Renderizando...</span></div><div class="mk-preview__actions"><button class="btn btn--primary btn--small" onclick="dlItem('${id}')"><svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:var(--black)"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>Download PNG</button></div></div>`;
  render.innerHTML=item.html;
  html2canvas(render.firstElementChild,{useCORS:true,scale:0.8,backgroundColor:null,logging:false}).then(c=>{
    const pv=document.getElementById('pvRender');
    if(pv){pv.innerHTML='';c.style.cssText='width:100%;height:auto;display:block;border-radius:10px';pv.appendChild(c)}
    render.innerHTML='';
  }).catch(()=>{render.innerHTML=''});
}

window.dlItem=function(id){
  const item=posts.find(p=>p.id===id);if(!item)return;
  render.innerHTML=item.html;
  html2canvas(render.firstElementChild,{useCORS:true,scale:2,backgroundColor:null,logging:false}).then(c=>{
    const a=document.createElement('a');a.download='arena_coliseu_'+item.id+'.png';a.href=c.toDataURL('image/png');a.click();
    render.innerHTML='';
  }).catch(()=>{render.innerHTML=''});
};

buildGrid();
</script>
